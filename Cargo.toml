[workspace]
resolver = "2"
members = [
    "crates/security-compass-meta",
    "crates/sqrt-parser",
    "crates/sqrt-eval",
    "crates/security-compass-vm",
    "crates/security-compass-interpreter",
    "crates/security-compass-orchestrator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pest = "2.7"
pest_derive = "2.7"
regex = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
security-compass-meta = { path = "crates/security-compass-meta" }
sqrt-parser = { path = "crates/sqrt-parser" }
