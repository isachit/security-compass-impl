[package]
name = "security-compass-vm"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Forked Monty bytecode VM with parallel metadata tracking for the Security Compass Engine."

[lib]
name = "security_compass_vm"
path = "src/lib.rs"

[dependencies]
security-compass-meta.workspace = true
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", package = "ruff_python_parser", rev = "2c68057c4b0a666ffd73324013fad2ce3c2fa547" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", package = "ruff_python_ast", rev = "2c68057c4b0a666ffd73324013fad2ce3c2fa547" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", package = "ruff_text_size", rev = "2c68057c4b0a666ffd73324013fad2ce3c2fa547" }
ahash = { version = "0.8.0", features = ["serde"] }
indexmap = { workspace = true }
serde = { workspace = true }
postcard = { version = "1.1", features = ["alloc"] }
strum = { version = "0.27", features = ["derive"] }
hashbrown = "0.16.1"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
smallvec = { version = "1.13", features = ["serde"] }

[dev-dependencies]
serde_json.workspace = true
